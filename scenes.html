<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Animal Scenes</title>
    <link rel="stylesheet" href="shared/fonts.css">
    <!-- A placeholder until the scenes are built; it shares Animal World's look. -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 30px 20px;
            font-family: 'Nunito', 'Arial Rounded MT Bold', Arial, sans-serif;
            color: #fff;
            text-align: center;
            background: linear-gradient(150deg, #0f0c29, #302b63, #24243e);
        }
        h1 { font-size: clamp(2.4rem, 7vw, 4.5rem); font-weight: 900; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        p { font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 700; color: rgba(255,255,255,0.75); max-width: 30em; }
        a {
            display: inline-block;
            padding: 16px 28px;
            border-radius: 22px;
            background: rgba(255,255,255,0.18);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 1.3rem;
            font-weight: 900;
            text-decoration: none;
        }
        a:focus-visible { outline: 4px solid #FFD700; outline-offset: 4px; }
    </style>
</head>

    <h1>🌈 Animal Scenes</h1>
    <p>Calm, interactive animal scenes for touch screens and switches are on their way.</p>
