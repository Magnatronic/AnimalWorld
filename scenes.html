<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Animal Scenes</title>
    <link rel="stylesheet" href="shared/fonts.css">
    <link rel="stylesheet" href="shared/hold.css">
    <link rel="stylesheet" href="scenes/scenes.css">
</head>
<body>

<!-- ══ THE SCENE ══ -->
<div class="stage" id="stage" aria-label="Animal scene">
    <div id="bg"></div>
    <div class="wx-layer" id="wx-back"></div>
    <div id="layer"></div>
    <div class="wx-layer" id="wx-front"></div>
</div>
<div class="veil" id="veil"></div>
<div class="labels" id="labels" hidden></div>

<!-- ══ START: choose the animals; that tap starts the sound and goes full screen ══ -->
<!-- (Opened with a preset's link, it just says the preset's name and "Tap to start".) -->
<div class="start choosing" id="start">
    <a class="start-back" href="index.html">← Animal World</a>
    <h1>🌈 Animal Scenes</h1>
    <div class="start-choose" id="start-choose">
        <p>Choose the animals</p>
        <div class="start-themes" id="start-themes"></div>
        <p class="start-hint">A switch or key starts the one used last time.</p>
    </div>
    <div class="start-go" id="start-go" hidden>
        <p id="start-theme"></p>
        <button class="start-btn" id="start-btn">Tap to start</button>
        <p>Touch the animals, or press a switch.</p>
    </div>
</div>

<!-- ══ BACK TO THE CHOICE OF ANIMALS: tap ←; dim and cornered, like ⚙ ══ -->
<div class="corner corner-left" id="back-corner" hidden>
    <button id="back-btn" class="settings-btn" aria-label="Back to the choice of animals">←</button>
</div>

<!-- ══ THE ADULT'S CORNER: tap ⚙ for set-up ══ -->
<div class="corner">
    <button id="settings-btn" class="settings-btn" aria-label="Set-up">⚙</button>
</div>

<!-- ══ SET-UP ══ -->
<div class="setup" id="setup" hidden>
    <div class="setup-box">
        <div class="setup-head">
            <h2>⚙ Set-up</h2>
            <button class="setup-done" onclick="closeSetup()">✓ Done</button>
        </div>
        <div class="setup-tabs" id="setup-tabs">
            <button class="setup-tab" data-tab="presets">⭐ Presets</button>
            <button class="setup-tab" data-tab="scene">🎨 Scene</button>
            <button class="setup-tab" data-tab="weather">🌦️ Weather</button>
            <button class="setup-tab" data-tab="switches">🎛️ Switches</button>
            <button class="setup-tab" data-tab="sound">🔊 Sound</button>
        </div>
        <div class="setup-body" id="setup-body"></div>
        <div class="setup-foot">
            <button class="setup-exit" onclick="leaveScenes()">← Animal World</button>
            <button class="setup-exit" onclick="chooseAnimals()">🔄 Choose animals</button>
            <span class="setup-saved">Changes are saved on this device</span>
        </div>
    </div>
</div>

<script src="shared/themes.js"></script>
<script src="shared/switches.js"></script>
<script src="shared/hold.js"></script>
<script src="scenes/art.js"></script>
<script src="scenes/art-safari.js"></script>
<script src="scenes/art-arctic.js"></script>
<script src="scenes/art-ocean.js"></script>
<script src="scenes/art-fish.js"></script>
<script src="scenes/art-minibeasts.js"></script>
<script src="scenes/scenes.js"></script>
<script src="scenes/presets.js"></script>
<script src="scenes/setup.js"></script>

</body>
</html>
