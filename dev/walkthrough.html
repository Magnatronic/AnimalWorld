<html><body><iframe id=f src="/index.html" style="width:1280px;height:900px;border:0"></iframe><script>
const f = document.getElementById('f'), log = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
f.onload = async () => {
  f.contentWindow.localStorage.clear();
  if (location.hash === '#area') { f.contentWindow.setSetting('area.size', 60); f.contentWindow.setSetting('area.pos', 'right'); }
  const w = f.contentWindow, d = f.contentDocument;
  w.addEventListener('error', e => log.push('ERROR ' + e.message));
  const origErr = w.console.error; w.console.error = (...a) => { log.push('CONSOLE.ERROR ' + a.join(' ')); origErr.apply(w.console, a); };
  const act = () => d.querySelector('.screen.active').id;
  const click = async sel => { const el = d.querySelector(sel); if (!el) { log.push('MISSING ' + sel); return; } el.click(); await wait(400); };
  // every inline handler must resolve to a global function
  const names = new Set([...d.querySelectorAll('[onclick]')].map(e => e.getAttribute('onclick').match(/^(\w+)/)[1]));
  log.push('handlers: ' + [...names].sort().map(n => n + '=' + typeof w[n]).join(' '));
  const keys = w.eval('Object.keys(themes)');
  log.push('themes: ' + keys.join(','));
  for (const k of keys) {
    await click(`[onclick="pickTheme('${k}')"]`);
    log.push(`[${k}] ${act()} "${d.getElementById('act-title').textContent}" class=${d.getElementById('activities').className}`);
    await click('#activities [onclick="showAnimals()"]');
    const cards = [...d.querySelectorAll('#animal-grid .animal-card')];
    log.push(`  explore ${act()} ${cards.length} cards: ` + cards.map(c => c.querySelector('.animal-name').textContent + '<' + c.querySelector('img').getAttribute('src').split('/').pop() + '>').join(' '));
    cards[0].click(); await wait(300);
    await click('#animals .back-btn');
    await click('#activities [onclick="showDifficulty()"]');
    await click('[onclick="startMemory(4, 2)"]');
    log.push(`  memory ${act()} cards=${d.querySelectorAll('#memory [data-animal]').length}`);
    await click('#memory .back-btn'); await click('#difficulty .back-btn');
    await click('#activities [onclick="showWamDifficulty()"]');
    await click(`[onclick="startWam('easy')"]`); await wait(2000);
    log.push(`  wam ${act()} holes=${d.querySelectorAll('.wam-hole').length} active=${d.querySelectorAll('.wam-hole.active').length} timer=${d.getElementById('wam-timer').textContent}`);
    await click('[onclick="stopWam()"]'); await click('#wam-difficulty .back-btn');
    await click('#activities [onclick="showFtaDifficulty()"]');
    await click('[onclick="startFta(4)"]');
    log.push(`  fta ${act()} cards=${d.querySelectorAll('#fta-grid .fta-card').length}`);
    await click('#fta-game .back-btn'); await click('#fta-difficulty .back-btn');
    await click('#activities .back-btn');
    log.push(`  back to ${act()}`);
  }
  await click('[onclick="toggleScanMode()"]'); await wait(1500);
  log.push('scan on: highlighted=' + d.querySelectorAll('[class*="scan-"]').length + ' settingsBtn=' + d.getElementById('settings-btn').className);
  w.openSettings(); await wait(300); log.push('settings open=' + d.getElementById('settings-panel').className);
  await click('[data-setting="scan.speed"] [data-value="800"]'); log.push('speed=' + w.eval('settings.scan.speed'));
  w.closeSettings(); await click('[onclick="toggleScanMode()"]');
  log.push('fonts/css: body font=' + w.getComputedStyle(d.body).fontFamily + ' home bg=' + w.getComputedStyle(d.getElementById('home')).backgroundImage.slice(0, 40));
  document.body.innerHTML = '<pre id=r>' + log.join('\n').replace(/</g, '&lt;') + '</pre>';
};
</script></body></html>
